<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streak celebration prototype</title>
<!--
  Full-screen streak celebration, v2. Spec: design/streak-motion-spec.md.
  Standalone over file://. Hand-written SVG + WAAPI only; no images, video or libraries.
  Everything between the APP SLICE markers is meant to move into web/app.js.
  Query: ?embed=1 shows only the phone (for design/streak-compare.html); &qa=1 uses the
  reference's near-white ground so pixel masks line up; &t=ms pauses at that time.
  window.celSeek(ms) pauses every effect at ms; window.celPlay() replays;
  window.celTiming() replays at 1x and resolves real-time beat timings.
-->
<style>
:root {
  color-scheme: light dark;
  --ground: #EEECE7; --surface: #FFFFFF; --surface-2: #E5E2DB;
  --ink: #161513; --ink-2: #5E5951;
  --accent: #FF5B1F; --accent-text: #B83A0C;
  --nav-icon: #9C978F;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1); --ease-out: cubic-bezier(.16,1,.3,1);
}
:root[data-theme="dark"] {
  --ground: #0E0D0C; --surface: #1B1A18; --surface-2: #2A2825;
  --ink: #F2EFEA; --ink-2: #A8A299;
  --accent: #FF6A2E; --accent-text: #FF8A5C; --nav-icon: #6A655E;
}
:root.qa { --ground: #FDFDFB; }
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-ui); background: #8a8780; color: var(--ink); }
.harness { display: flex; gap: 24px; padding: 20px; align-items: flex-start; flex-wrap: wrap; }
.controls { display: grid; gap: 10px; max-width: 340px; font-size: 14px; color: #111; background: #fff; padding: 14px; border-radius: 14px; }
.controls input[type=range] { width: 100%; }
.controls output { font-variant-numeric: tabular-nums; }
.phone { position: relative; width: 390px; height: 873px; overflow: hidden; background: var(--ground); border-radius: 28px; }
.embed body, body.embed { background: var(--ground); }
body.embed .harness { padding: 0; }
body.embed .controls { display: none; }
body.embed .phone { border-radius: 0; width: 100vw; height: 100vh; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ===== APP CSS (move to web/styles.css) ===== */
.cel {
  --u: calc(min(100vw, 430px) / 572); /* 1 reference px; the reference phone is 572 px wide */
  --cel-y: #FDD600; --cel-r: #FC4949; --cel-o: #FF9902; --cel-c: #FCF6F2;
  --cel-pale: color-mix(in srgb, var(--cel-y) 28%, var(--ground));
  --cel-grey: color-mix(in srgb, var(--surface-2) 84%, var(--ink-2));
  --cel-grey-2: color-mix(in srgb, var(--surface-2) 93%, var(--ink-2));
  position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
  padding-bottom: calc(118 * var(--u)); background: var(--ground); overflow: hidden;
  cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.phone .cel { position: absolute; }
body:not(.embed) .phone .cel { --u: calc(390px / 572); }
.cel-stack { position: relative; width: calc(572 * var(--u)); height: calc(690 * var(--u)); flex: none; }
.cel-stage { position: absolute; left: 0; top: 0; width: 100%; height: calc(216 * var(--u)); }
.cel-stage svg { position: absolute; left: 0; top: calc(-384 * var(--u)); width: 100%; height: calc(820 * var(--u)); overflow: visible; }
.cel-stage .cel-L, .cel-stage .cel-p { opacity: 0; }                 /* every animated layer rests hidden ... */
.cel-stage .cel-final, .cel-stage .cel-shadow { opacity: 1; }      /* ... except the final frame */
.cel-ring { fill: none; stroke: var(--cel-y); stroke-opacity: .32; }
.cel-num {
  position: absolute; left: 0; right: 0; top: calc(253 * var(--u)); display: flex; justify-content: center;
  font: 800 calc(172 * var(--u))/.74 var(--font-round); letter-spacing: -.06em; font-variant-numeric: tabular-nums;
}
.cel-d { position: relative; display: block; clip-path: inset(-.36em -.3em -.3em -.3em); } /* the new digit drops in from behind this top edge */
.cel-new { display: block; padding: .12em 0; margin: -.12em 0; background: linear-gradient(#FB9200 12%, #FD7642 88%); -webkit-background-clip: text; background-clip: text; color: transparent; transform-origin: 50% 100%; }
.cel-sink { position: absolute; left: -.2em; right: -.2em; top: -.2em; bottom: 0; overflow: hidden; text-align: center; }
.cel-old { display: block; padding-top: .2em; color: var(--cel-grey-2); opacity: 0; }
.cel-label { position: absolute; left: 0; right: 0; top: calc(414 * var(--u)); text-align: center; font: 700 calc(38 * var(--u))/1.2 var(--font-round); color: color-mix(in srgb, var(--accent) 82%, var(--accent-text)); }
.cel-note { position: absolute; left: calc(40 * var(--u)); right: calc(40 * var(--u)); top: calc(640 * var(--u)); text-align: center; font: 500 calc(25 * var(--u))/1.4 var(--font-ui); color: var(--ink-2); }
.cel-week { position: absolute; left: 0; right: 0; top: calc(530 * var(--u)); height: calc(81 * var(--u)); }
.cel-wd { position: absolute; top: 0; left: calc(286 * var(--u) + (var(--i) - 3) * 77 * var(--u) - 30 * var(--u)); width: calc(60 * var(--u)); text-align: center; }
.cel-wl { display: block; font: 600 calc(17 * var(--u))/1.3 var(--font-ui); color: color-mix(in srgb, var(--ink-2) 55%, var(--ground)); }
.cel-wd.today .cel-wl { color: var(--accent-text); }
.cel-dot { position: absolute; left: calc(8 * var(--u)); top: calc(37 * var(--u)); width: calc(44 * var(--u)); height: calc(44 * var(--u)); border-radius: 50%; background: var(--surface-2); }
.cel-pill {
  position: absolute; top: calc(37 * var(--u)); height: calc(44 * var(--u)); border-radius: calc(22 * var(--u));
  left: calc(286 * var(--u) + (var(--a) - 3) * 77 * var(--u) - 22 * var(--u)); width: calc((var(--b) - var(--a)) * 77 * var(--u) + 44 * var(--u));
  background: linear-gradient(var(--cel-r) 20%, var(--cel-o) 100%);
}
.cel-pill.cel-pill-ring { background: none; box-shadow: 0 0 0 calc(4 * var(--u)) var(--cel-y); }
.cel-check { position: absolute; top: calc(12 * var(--u)); width: calc(20 * var(--u)); height: calc(20 * var(--u)); left: calc(var(--k) * 77 * var(--u) + 12 * var(--u)); }
.cel-check path { fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.cel-coin, .cel-bit, .cel-crown { position: absolute; opacity: 0; pointer-events: none; }
.cel-coin {
  left: calc(286 * var(--u) + (var(--i) - 3) * 77 * var(--u) - 27 * var(--u)); top: calc(-40 * var(--u)); width: calc(54 * var(--u)); height: calc(54 * var(--u));
  border-radius: 50%; background: radial-gradient(circle at 45% 40%, #FFB33B 0 46%, var(--cel-o) 48% 100%); box-shadow: inset 0 calc(-4 * var(--u)) 0 #E57E00;
}
.cel-bit { left: calc(286 * var(--u) + (var(--i) - 3) * 77 * var(--u) - 4 * var(--u)); top: calc(55 * var(--u)); width: calc(8 * var(--u)); height: calc(14 * var(--u)); border-radius: calc(3 * var(--u)); background: var(--cel-y); }
.cel-crown { top: calc(-2 * var(--u)); height: calc(46 * var(--u)); overflow: visible; }
.cel-crown path { fill: var(--cel-y); }
#toast.streak-quiet { position: fixed; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } /* announcement only while .cel is up */
/* ===== /APP CSS ===== */
</style>
</head>

// Tapered crescent around the orbit centre, centred on angle 0; the clockwise (leading) end is thicker.
function celCrescent(R, spanDeg, T) {
  const pts = [], back = [], n = 24;
  for (let k = 0; k <= n; k++) {
    const s = k / n, a = (s - .5) * spanDeg * Math.PI / 180;

  return `M${pts.join('L')}L${back.join('L')}Z`;

  document.getElementById('status').textContent = `${count}-day ${document.getElementById('kind').value === 'tasks' ? 'task' : 'Moment'} streak`;
  if (!motion()) return;
  playCelebration(parts, (node, frames) => { try { anims.push(node.animate(frames, { duration: CEL_MS, easing: 'linear' })); } catch (e) { console.error(e.message, node.getAttribute('class'), JSON.stringify(frames.map(f => f.offset))); } });
  const rate = +document.getElementById('speed').value;
  anims.forEach(a => { a.playbackRate = rate; if (paused) a.pause(); });
  t0 = performance.now();
}
window.celSeek = ms => { if (!anims.length) build(true); anims.forEach(a => { a.pause(); a.currentTime = Math.min(ms, CEL_MS - .01); }); return ms; };
window.celPlay = () => build(false);
// real-time check: replays at 1x and logs when master time crosses each beat, against performance.now()
window.celTiming = () => new Promise(res => {
  document.getElementById('speed').value = '1'; build(false);
  const beats = [700, 1067, 1767, 2067, 2667, 3133, 3300, 3900, 4667], log = []; let i = 0; const m = anims[0], start = performance.now();
  const tick = () => { const now = performance.now() - start; while (i < beats.length && m.currentTime >= beats[i]) log.push({ beat: beats[i++], wall: Math.round(now) });
    if (m.playState === 'finished' || i >= beats.length) { m.finished.catch(() => {}).then(() => res({ log, finishedWall: Math.round(performance.now() - start) })); } else requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
});
addEventListener('message', e => { if (e.data && e.data.type === 'play') celPlay(); if (e.data && e.data.type === 'seek') { celSeek(e.data.ms); requestAnimationFrame(() => requestAnimationFrame(() => e.source.postMessage({ type: 'seeked', ms: e.data.ms }, '*'))); } });
const scrub = document.getElementById('scrub'), tout = document.getElementById('tout');
scrub.addEventListener('input', () => { celSeek(+scrub.value); tout.value = scrub.value; });
document.getElementById('replay').onclick = () => build(false);
['from', 'kind', 'rm', 'speed'].forEach(id => document.getElementById(id).addEventListener('change', () => build(false)));
document.getElementById('dark').addEventListener('change', e => { document.documentElement.dataset.theme = e.target.checked ? 'dark' : 'light'; build(false); });
(function loop() { if (anims[0] && !qs.has('embed')) { tout.value = Math.round(anims[0].currentTime || 0); scrub.value = tout.value; } requestAnimationFrame(loop); })();
if (qs.has('from')) document.getElementById('from').value = qs.get('from');
if (qs.has('t')) celSeek(+qs.get('t')); else if (!qs.has('embed')) build(false); else celSeek(0);
</script>
</body>
